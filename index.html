// ---------- Health and stamina ----------
const stats = { health: 100, maxHealth: 100, stamina: 100, maxStamina: 100, exhausted: false, regenDelay: 0, sinceHurt: 99, hurtFlash: 0 };
const SPRINT_DRAIN = 18, JUMP_COST = 10, PUNCH_COST = 8;   // stamina costs
const STAMINA_REGEN = 14, EXHAUST_RECOVER = 20;            // per second / stamina needed to recover from exhaustion
const FALL_SAFE_SPEED = 9;                                 // landing faster than this hurts

const hpFill = document.getElementById('hpFill'), hpText = document.getElementById('hpText');
const stFill = document.getElementById('stFill'), stText = document.getElementById('stText');
const hurtEl = document.getElementById('hurt');

function canExert(cost) { return !stats.exhausted && stats.stamina >= cost; }
function spend(n) {
  stats.stamina = Math.max(0, stats.stamina - n);
  stats.regenDelay = 0.8;                                  // brief pause before it refills
  if (stats.stamina === 0) stats.exhausted = true;         // can't sprint, jump or punch until it recovers a bit
}
function addStamina(n) {
  stats.stamina = Math.min(stats.maxStamina, stats.stamina + n);
  if (stats.exhausted && stats.stamina >= EXHAUST_RECOVER) stats.exhausted = false;
}
function heal(n) { stats.health = Math.min(stats.maxHealth, stats.health + n); }
function hurt(n) {
  stats.health -= n;
  stats.hurtFlash = 1;
  stats.sinceHurt = 0;
  if (stats.health <= 0) passOut();
}
function landed(speed) { if (speed > FALL_SAFE_SPEED) hurt((speed - FALL_SAFE_SPEED) * 9); }

function passOut() {
  camera.position.set(0, EYE_HEIGHT, 5);
  eyeH = EYE_HEIGHT; velocityY.v = 0; onGround = true;
  stats.health = stats.maxHealth; stats.stamina = stats.maxStamina; stats.exhausted = false;
  toast('You passed out and woke up back at the start');
}

function eatBerries() {
  if (stats.stamina >= stats.maxStamina && stats.health >= stats.maxHealth) { toast('Already full'); return false; }
  addStamina(40);
  heal(10);
  toast('Ate berries: +40 stamina, +10 health');
  return true;
}

// Eat / use whatever is in a slot
function useItem(i) {
  const s = inv[i];
  if (!s) return;
  const it = ITEMS[s.id];
  if (!it.use) { toast("Can’t use " + it.name); return; }
  if (!it.use()) return;
  if (--s.n === 0) inv[i] = null;
  renderInv();
}

function updateStats(dt) {
  stats.regenDelay -= dt;
  if (stats.regenDelay <= 0) addStamina(STAMINA_REGEN * dt);
  stats.sinceHurt += dt;
  if (stats.sinceHurt > 6 && stats.stamina > 30) heal(1.5 * dt); // slow recovery if you've stayed out of trouble

  hpFill.style.width = (stats.health / stats.maxHealth * 100) + '%';
  stFill.style.width = (stats.stamina / stats.maxStamina * 100) + '%';
  hpText.textContent = 'Health ' + Math.ceil(stats.health);
  stText.textContent = stats.exhausted ? 'Out of breath' : 'Stamina ' + Math.ceil(stats.stamina);
  stFill.classList.toggle('tired', stats.exhausted);

  stats.hurtFlash = Math.max(0, stats.hurtFlash - dt * 1.5);
  hurtEl.style.opacity = stats.hurtFlash;
}

// ---------- Gathering ----------
// Punch a tree for sticks or a rock for stones. Each has a limited supply. When it runs out, a tree falls
// (leaving a stump) and a rock crumbles away for good.
// Holding an axe (trees) or pickaxe (rocks) in the selected hotbar slot doubles the yield.
const GATHER = { tree: { give: 'stick', tool: 'axe' }, rock: { give: 'stone', tool: 'pickaxe' } };
const shaking = new Set();

function give(id, n, point) {
  const left = addItem(id, n);                      // anything that doesn't fit drops on the ground
  for (let i = 0; i < left; i++) spawnPickup(id, point.x + (Math.random() - 0.5), point.z + (Math.random() - 0.5));
  return `+${n} ${ITEMS[id].name}` + (left ? ' (backpack full, dropped)' : '');
}

function gather(obj, point) {
  const r = obj.userData.res, g = GATHER[obj.userData.kind];
  if (r.left <= 0) return;
  if (--r.left === 0) bust(obj);
  const held = heldItem();
  const msgs = [give(g.give, held === g.tool ? 2 : 1, point)];
  if (obj.userData.kind === 'tree' && Math.random() < 0.15) msgs.push(give('berry', 1, point)); // the odd berry shakes loose
  if (r.left === 0) msgs.push(obj.userData.kind === 'tree' ? 'The tree falls!' : 'The rock crumbles!');
  toast(msgs.join(', '));
  obj.userData.shake = 0.3;
  shaking.add(obj);
}

function updateShake(dt) {
  for (const o of shaking) {
    o.userData.shake -= dt;
    if (o.userData.shake <= 0) { o.rotation.z = 0; shaking.delete(o); }
    else o.rotation.z = Math.sin(performance.now() / 25) * o.userData.shake * 0.12;
  }
}

// ---------- Busting ----------
const busting = [];   // things mid-collapse

function bust(obj) {
  const u = obj.userData;
  const drop = u.kind === 'tree' ? 'stick' : 'stone';
  for (let i = 0; i < 2; i++) {      // a couple of extras land on the ground
    const a = Math.random() * Math.PI * 2, d = 1 + Math.random() * 0.8;
    spawnPickup(drop, obj.position.x + Math.cos(a) * d, obj.position.z + Math.sin(a) * d);
  }
  if (u.kind === 'tree') {
    u.stump = true;
    u.trunk.scale.y = 0.18;                          // just a stump left
    u.trunk.position.y = u.trunkH * 0.18 / 2;
    u.box.max.y = u.trunkH * 0.18 * u.size;          // low enough to hop onto
  } else {
    colliders.splice(colliders.indexOf(u.box), 1);   // solid no more
    rocks.splice(rocks.findIndex(r => r.obj === obj), 1);
  }
  busting.push({ obj, t: 0 });
}

function updateBusting(dt) {
  for (let i = busting.length - 1; i >= 0; i--) {
    const b = busting[i], u = b.obj.userData;
    b.t += dt / 0.35;
    const k = Math.min(1, b.t);
    if (u.kind === 'tree') {
      u.foliage.scale.setScalar(Math.max(0.001, 1 - k));  // leaves shrink down into the ground
      u.foliage.position.y = -k * 1.2;
      if (k >= 1) u.foliage.visible = false;
    } else {
      b.obj.scale.copy(u.baseScale).multiplyScalar(Math.max(0.001, 1 - k));
      if (k >= 1) { b.obj.parent.remove(b.obj); disposeObject(b.obj); }
    }
    if (k >= 1) busting.splice(i, 1);
  }
}

function killDino(d) {
  const u = d.userData;
  dinos.splice(dinos.indexOf(d), 1);
  dinoBoxes.splice(dinoBoxes.indexOf(u.box), 1);
  u.dying = 0.001;
  dying.push(d);
  huntKills++;
  const meat = 1 + Math.floor(u.sp.hp / 25);
  const hide = 1 + (u.sp.hp >= 36 ? 1 : 0);
  const scatterAround = id => spawnPickup(id, d.position.x + (Math.random() - 0.5) * 2.4, d.position.z + (Math.random() - 0.5) * 2.4);
  for (let i = 0; i < meat; i++) scatterAround('meat');
  for (let i = 0; i < hide; i++) scatterAround('hide');
  respawns.push(performance.now() / 1000 + 60);
  toast(`Defeated the ${u.sp.name}! It dropped ${meat} meat and ${hide} hide.`, 2500);
}

function updateDying(dt) {
  for (let i = dying.length - 1; i >= 0; i--) {
    const d = dying[i], u = d.userData;
    u.dying += dt;
    const k = Math.min(1, u.dying / 0.6);
    d.rotation.z = k * Math.PI / 2;                          // tips over onto its side
    d.position.y = k * (u.sp.body[0] / 2) * u.size;
    if (u.dying > 2.2) {                                     // then shrinks away
      d.scale.setScalar(u.size * Math.max(0.001, 1 - (u.dying - 2.2) / 0.5));
      if (u.dying > 2.7) { scene.remove(d); disposeObject(d); dying.splice(i, 1); }
    }
  }
  const now = performance.now() / 1000;
  for (let i = respawns.length - 1; i >= 0; i--) {
    if (now >= respawns[i] && dinos.length < DINO_COUNT) { spawnDino(35); respawns.splice(i, 1); }
  }
}

const countItem = id => inv.reduce((sum, s) => sum + (s && s.id === id ? s.n : 0), 0);

function removeItems(id, n) {
  for (let i = 0; i < SLOTS && n > 0; i++) {
    const s = inv[i];
    if (s && s.id === id) { const m = Math.min(n, s.n); s.n -= m; n -= m; if (!s.n) inv[i] = null; }
  }
}

const stationOk = r => r.at === 'hand' || (r.at === 'bench' ? nearBench() : nearFire());

function craft(r) {
  if (!canCraft(r) || !stationOk(r)) return;
  for (const [id, n] of Object.entries(r.cost)) removeItems(id, n);
  if (addItem(r.out, r.n || 1) > 0) spawnPickup(r.out, camera.position.x + 1, camera.position.z); // backpack full

// ---------- The bench itself ----------
function makeBench() {
  const g = new THREE.Group();
  part(g, cube(1.6, 0.15, 0.9), 0xa9763d, 0, 0.9, 0, TEX.planks);                                   // top
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) part(g, cube(0.15, 0.9, 0.15), 0x7a5230, sx * 0.7, 0.45, sz * 0.35); // legs
  part(g, cube(1.4, 0.08, 0.7), 0x7a5230, 0, 0.35, 0);                                  // lower shelf
  part(g, cube(0.35, 0.12, 0.2), 0x9a9a9a, -0.4, 1.03, 0.1);                            // a stone on top
  part(g, cube(0.5, 0.05, 0.08), 0x8a5a2b, 0.3, 1.0, -0.1);                             // a stick on top
  return g;
}

// A free spot just in front of you for something w wide, d deep and h tall (or a message that there is no room)
function spotInFront(w, d, h) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const x = camera.position.x + dir.x * 2.2, z = camera.position.z + dir.z * 2.2;
  const box = new THREE.Box3(new THREE.Vector3(x - w / 2, 0, z - d / 2), new THREE.Vector3(x + w / 2, h, z + d / 2));
  if (colliders.some(c => c.intersectsBox(box)) || dinoBoxes.some(c => c.intersectsBox(box)) || npcBoxes.some(c => c.intersectsBox(box)) || inPond(x, z, 1.5)) {
    toast('No room to place it here');
    return null;
  }
  return { x, z, box };
}

function placeBench() {
  const spot = spotInFront(1.7, 1.0, 1.0);
  if (!spot) return false;
  const g = makeBench();
  g.position.set(spot.x, 0, spot.z);
  scene.add(g);
  colliders.push(spot.box);            // solid, so you and the dinosaurs go around it
  benches.push({ x: spot.x, z: spot.z });
  toast('Bench placed. Open your backpack (Tab) next to it to craft');
  return true;
}

const flames = [];                     // placed campfires' flames, so they can flicker
function placeCampfire() {
  const spot = spotInFront(1.6, 1.6, 0.5);
  if (!spot) return false;
  const { group, flame } = makeCampfire();
  flame.userData.phase = Math.random() * 6;
  flames.push(flame);
  group.position.set(spot.x, 0, spot.z);
  scene.add(group);
  colliders.push(spot.box);
  fires.push({ x: spot.x, z: spot.z });
  toast('Campfire lit. Stand next to it and open your backpack (Tab) to cook');
  return true;
}

// ---------- Touch controls ----------

function startTouch() {
  dragMode = true;                                   // pointer lock isn't available on touch screens
  overlay.style.display = 'none';
  camera.rotation.order = 'YXZ';
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}

// Runs every frame: turns the joystick and toggle buttons into the same key presses the keyboard uses
function updateTouch() {
  if (!isTouch) return;
  keys.KeyW = joy.dy < -0.3; keys.KeyS = joy.dy > 0.3; keys.KeyA = joy.dx < -0.3; keys.KeyD = joy.dx > 0.3;
  keys.KeyC = touchCrouch; keys.ShiftLeft = touchSprint; keys.Space = touchJump;
  if (touchPunch && !inventoryOpen && (controls.isLocked || dragMode)) startPunch();   // hold to keep punching
}

if (isTouch) {
  const byId = id => document.getElementById(id);
  const zoneMove = byId('zoneMove'), zoneLook = byId('zoneLook'), joyBase = byId('joyBase'), joyKnob = byId('joyKnob'), R = 55;

  zoneMove.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (joy.id !== null) return;
    try { zoneMove.setPointerCapture(e.pointerId); } catch (x) {}
    joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
    joyBase.style.display = 'block'; joyBase.style.left = joy.ox + 'px'; joyBase.style.top = joy.oy + 'px';
    joyKnob.style.transform = '';
  });
  zoneMove.addEventListener('pointermove', e => {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const k = Math.min(1, R / (Math.hypot(dx, dy) || 1));
    dx *= k; dy *= k;
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joy.dx = dx / R; joy.dy = dy / R;
  });
  const endJoy = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.dx = joy.dy = 0; joyBase.style.display = 'none'; };
  zoneMove.addEventListener('pointerup', endJoy);
  zoneMove.addEventListener('pointercancel', endJoy);

  zoneLook.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (look.id !== null) return;
    try { zoneLook.setPointerCapture(e.pointerId); } catch (x) {}
    look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY;
  });
  zoneLook.addEventListener('pointermove', e => {
    if (e.pointerId !== look.id || inventoryOpen) return;
    const dx = e.clientX - look.x, dy = e.clientY - look.y;
    look.x = e.clientX; look.y = e.clientY;
    camera.rotation.order = 'YXZ';
    camera.rotation.y -= dx * 0.0045;
    camera.rotation.x = Math.max(-1.45, Math.min(1.45, camera.rotation.x - dy * 0.0045));
  });
  const endLook = e => { if (e.pointerId === look.id) look.id = null; };
  zoneLook.addEventListener('pointerup', endLook);
  zoneLook.addEventListener('pointercancel', endLook);

  // Buttons: "hold" ones act while pressed, "tap" ones act once, "toggle" ones switch on and off
  const button = (id, onDown, onUp) => {
    const b = byId(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} b.classList.add('down'); onDown(b); });
    const up = () => { b.classList.remove('down'); if (onUp) onUp(b); };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
  };
  button('bJump', () => touchJump = true, () => touchJump = false);
  button('bPunch', () => { touchPunch = true; }, () => { touchPunch = false; });
  button('bCrouch', b => { touchCrouch = !touchCrouch; b.classList.toggle('on', touchCrouch); });
  button('bSprint', b => { touchSprint = !touchSprint; b.classList.toggle('on', touchSprint); });
  button('bAct', () => pickupNearest());              // pick up, or talk to a villager
  button('bUse', () => useItem(selected));
  button('bBag', () => setInventory(!inventoryOpen));
  byId('prompt').addEventListener('click', () => { if (/^Tap: (Craft|Cook)/.test(promptEl.textContent)) setInventory(true); else pickupNearest(); });

  // Backpack buttons (touch has no right-click or shift-click): tap an item first, then use or drop it
  byId('packUse').onclick = () => { if (moveFrom === null) { toast('Tap an item first'); return; } const i = moveFrom; moveFrom = null; useItem(i); renderInv(); };
  byId('packDrop').onclick = () => { if (moveFrom === null) { toast('Tap an item first'); return; } const i = moveFrom; moveFrom = null; dropOne(i); renderInv(); };
  byId('packClose').onclick = () => setInventory(false);

  // Keep the page from scrolling, zooming or pulling to refresh while playing
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('#pack')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
}

// ---------- Movement ----------
const WALK_SPEED = 6;
const SPRINT_SPEED = 10;
const JUMP_SPEED = 7;
const GRAVITY = 20;
const RADIUS = 0.4; // player half-width for collisions

// Crouching: hold C. The eye lowers smoothly; you only stand back up if there's headroom.
const CROUCH_EYE = 1.0;
let eyeH = EYE_HEIGHT;
function updateCrouch(dt) {
  const want = keys.KeyC ? CROUCH_EYE : EYE_HEIGHT;
  if (eyeH === want) return;
  const step = 5 * dt;
  const next = Math.abs(want - eyeH) <= step ? want : eyeH + Math.sign(want - eyeH) * step;
  const delta = next - eyeH;
  if (delta > 0) {                              // standing up: check for room above
    const test = camera.position.clone();
    test.y += delta;
    if (hits(test, next)) return;
  }
  eyeH = next;
  camera.position.y += delta;                   // feet stay where they are
}

function hits(pos, eye = eyeH) {
  const player = new THREE.Box3(
    new THREE.Vector3(pos.x - RADIUS, pos.y - eye + 0.01, pos.z - RADIUS),
    new THREE.Vector3(pos.x + RADIUS, pos.y + 0.2,               pos.z + RADIUS)
  );
  return colliders.some(c => c.intersectsBox(player)) || dinoBoxes.some(c => c.intersectsBox(player)) || npcBoxes.some(c => c.intersectsBox(player));
}

const velocityY = { v: 0 };
let onGround = true;
const clock = new THREE.Clock();

function update(dt) {
  if ((!controls.isLocked && !dragMode) || inventoryOpen) return;
  if (riding) { updateRide(dt); return; }

  updateCrouch(dt);

  // Horizontal movement relative to where you're looking
  const wading = inPond(camera.position.x, camera.position.z) ? 0.5 : 1; // half speed in water
  const crouched = eyeH < EYE_HEIGHT - 0.05;
  const moving = keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD;
  const sprinting = (keys.ShiftLeft || keys.ShiftRight) && moving && !crouched && canExert(1);
  if (sprinting) spend(SPRINT_DRAIN * dt);
  const base = (crouched ? WALK_SPEED * 0.5 : sprinting ? SPRINT_SPEED : WALK_SPEED) * (stats.exhausted ? 0.7 : 1);
  const speed = base * dt * wading;
  const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const strafe  = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);

  // Normalize so diagonal isn't faster
  const len = Math.hypot(forward, strafe) || 1;
  const before = camera.position.clone();
  controls.moveForward((forward / len) * speed);
  controls.moveRight((strafe / len) * speed);

  // Resolve each horizontal axis separately so you slide along walls
  const target = camera.position.clone();
  camera.position.copy(before);
  camera.position.x = target.x;
  if (hits(camera.position)) camera.position.x = before.x;
  camera.position.z = target.z;
  if (hits(camera.position)) camera.position.z = before.z;

  // Jump + gravity, with landing on top of boxes
  if (keys.Space && onGround && canExert(JUMP_COST)) { velocityY.v = JUMP_SPEED; spend(JUMP_COST); }
  velocityY.v -= GRAVITY * dt;
  onGround = false;

  const prevY = camera.position.y;
  camera.position.y += velocityY.v * dt;
  if (hits(camera.position)) {
    camera.position.y = prevY;
    if (velocityY.v < 0) { onGround = true; landed(-velocityY.v); } // landed on a box
    velocityY.v = 0;                       // or bumped your head
  }
  if (camera.position.y <= eyeH) {   // the floor
    camera.position.y = eyeH;
    landed(-velocityY.v);
    velocityY.v = 0;
    onGround = true;
  }
}

// ---------- Loop ----------
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // clamp so tab-switching doesn't cause a huge step
  updateDinos(dt);
  update(dt);
  updatePickups(dt);
  updatePrompt();
  updatePunch(dt);
  updateTouch();
  updateStats(dt);
  updateShake(dt);
  updateBusting(dt);
  updateVillage(dt);
  updateDying(dt);
  updateQuests();
  updateClouds(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
</body>
